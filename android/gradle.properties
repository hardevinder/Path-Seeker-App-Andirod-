# ----------------------------
# Gradle JVM performance
# ----------------------------
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# ----------------------------
# AndroidX / Jetifier
# ----------------------------
android.useAndroidX=true
android.enableJetifier=true

# ----------------------------
# Juspay / HyperSDK
# (Multiple keys on purpose – plugin checks different names)
# ----------------------------
JUSPAY_CLIENT_ID=hdfcmaster
JUSPAY_CLIENT_IDS=hdfcmaster

HYPERSDK_CLIENT_ID=hdfcmaster
HYPERSDK_CLIENT_IDS=hdfcmaster

client_id=hdfcmaster
client_ids=hdfcmaster

juspayClientId=hdfcmaster
hypersdkClientId=hdfcmaster
