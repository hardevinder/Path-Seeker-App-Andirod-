name: smcis_app
description: "Seth Malook Chand International School app"
publish_to: "none"

# UPDATED for Play Store release
# versionName = 1.0.37
# versionCode = 59
version: 1.0.37+59

environment:
  sdk: ">=3.4.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # -------------------------
  # 🎨 UI & Charts
  # -------------------------
  cupertino_icons: ^1.0.6
  fl_chart: ^0.64.0
  pie_chart: ^5.3.2
  oktoast: ^3.3.1
  provider: ^6.1.2

  # -------------------------
  # 🔥 Firebase Integration
  # -------------------------
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.13.0
  firebase_messaging: ^14.7.4
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^17.2.2

  # -------------------------
  # 🌐 Networking & Storage
  # -------------------------
  http: ^1.2.2
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  flutter_file_dialog: ^3.0.2
  device_info_plus: ^10.1.0
  path: ^1.8.2

  # -------------------------
  # ⚙️ Utilities & Media
  # -------------------------
  url_launcher: ^6.3.0
  mime: ^1.0.4
  open_filex: ^4.3.2
  image_picker: ^1.0.7
  google_mlkit_document_scanner: ^0.5.0
  intl: ^0.19.0
  table_calendar: ^3.0.9
  http_parser: ^4.0.0
  file_selector: ^1.0.3

  # -------------------------
  # 🆕 Circulars / Chat / Teacher Updates & Realtime
  # -------------------------
  cached_network_image: ^3.2.4
  socket_io_client: ^2.0.0
  geolocator: ^12.0.0
  google_maps_flutter: 2.10.0

  # -------------------------
  # 🧑‍🏫 Teacher & Attendance
  # -------------------------
  pull_to_refresh: ^2.0.0
  connectivity_plus: ^6.0.3
  animations: ^2.0.11

  # -------------------------
  # ✨ New / Helpful Packages
  # -------------------------
  dropdown_search: ^5.0.3
  share_plus: ^10.0.0
  csv: ^5.0.0

  # -------------------------
  # 💳 HDFC SmartGateway - Hypercheckout Mobile SDK (Flutter)
  # -------------------------
  # ❌ TEMP REMOVED because Android build fails with 403 while fetching Juspay assets:
  hypersdkflutter: ^4.0.35

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#1976D2"
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"

dependency_overrides:
  google_maps_flutter_android: 2.14.7
  image_picker_android: 0.8.12+23
  shared_preferences_android: 2.4.10
  url_launcher_android: 6.3.16
